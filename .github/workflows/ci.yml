name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python -m pip install pillow

      - name: Frontend build and token check
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run check:tokens

      - name: Committed frontend build is up to date
        shell: pwsh
        run: |
          git add -A cmd/taushell/frontend/dist
          git diff --cached --ignore-cr-at-eol --exit-code --stat -- cmd/taushell/frontend/dist
          if ($LASTEXITCODE -ne 0) {
            throw 'cmd/taushell/frontend/dist is stale: run the frontend build and commit the result'
          }

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -timeout 15m ./...

      - name: Release build smoke test
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version 0.0.0-ci -SkipFrontend

      - uses: actions/upload-artifact@v4
        with:
          name: TauShell-ci-windows-x64
          path: dist/TauShell-0.0.0-ci-windows-x64.zip
          retention-days: 7
