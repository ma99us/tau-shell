name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install pillow

      - name: Frontend build, token check and tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run check:tokens
          npm test

      - name: Go format
        shell: pwsh
        run: |
          $unformatted = gofmt -l cmd internal
          if ($unformatted) { throw "gofmt needed: $($unformatted -join ', ')" }

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -timeout 15m ./...

      - name: Release build smoke test
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version 0.0.0-ci -SkipFrontend

      - uses: actions/upload-artifact@v4
        with:
          name: TauShell-ci-windows-x64
          path: dist/TauShell-0.0.0-ci-windows-x64.zip
          retention-days: 7
