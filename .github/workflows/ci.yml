name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python -m pip install pillow

      - name: Test release version synchronization
        run: node --test scripts\frontend-version.test.mjs scripts\app-version.test.mjs

      - name: Check app manifests against published GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts\app-version.mjs github

      - name: Set frontend version for the release smoke test
        shell: pwsh
        run: node scripts\frontend-version.mjs set 0.0.0-ci

      - name: Frontend build, token check and tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run check:tokens
          npm test

      - name: Go format
        shell: pwsh
        run: |
          $unformatted = gofmt -l cmd internal
          if ($unformatted) { throw "gofmt needed: $($unformatted -join ', ')" }

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -timeout 15m ./...

      - name: Release build smoke test
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version 0.0.0-ci -SkipFrontend

      - name: E2E script unit tests
        run: node --test e2e/smoke.test.mjs

      - name: End-to-end smoke test of the release ZIP
        shell: pwsh
        run: |
          ./scripts/smoke-test.ps1 -Zip dist/TauShell-0.0.0-ci-windows-x64.zip -Version 0.0.0-ci -Lifecycle
          if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: TauShell-ci-windows-x64
          path: dist/TauShell-0.0.0-ci-windows-x64.zip
          retention-days: 7
